# Binary Obelisk V1 — Design Model (editable source of truth)
#
# THREE NAMES, NEVER INTERCHANGEABLE — collapsing any two is how a tower silently
# dispatches nothing:
#   category = display hint, shown in `bd list`, names a plan-task template
#   stamp    = the ONE label a ticket carries (`bd create -l <stamp>`); what the
#              dispatcher matches on. Keys of `tasks:` below, bar none.
#   agent    = a real file in agents/; what gets spawned
#
# The three TEST nodes collapse all three names to ONE string on purpose: the node key
# IS the stamp IS the category, and the agent is that string plus "-er"
#   unit-tests  -> unit-tester      feature-test -> feature-tester      epic-e2e-test -> e2e-tester
# A tier is named for the TEST, never the tester, and never for a framework — the
# framework lives only in the framework-* skill the agent loads. Where stamp, category
# and agent drift apart, the wrong depth of coverage is dispatched and nothing reports it.
#
# Every node is a real beads issue. Relationships live in the arrays:
#   task.stamp     -> written with `bd create -l <stamp>`
#   task.parent    -> `--deps type:parent-child:<parent>`
#   task.depends-on-> `bd dep add <task> <dep> --type blocks`
#   task.agents    -> who does the work
#
# Nothing here is read at runtime — the loop's only input is the beads database.
# The tower is built top-down by the plan agents (plan-epic -> plan-feature ->
# plan-task) and EXECUTED bottom-up (`bd ready --claim`, close children, parent
# auto-unblocks). See claim-beads-loop.md for the dispatcher.
#
# respawn-agent: true = a fresh session of the same agent re-checks the work before
# the ticket may close. It is a STEP inside the one ticket, never a second ticket.

# ============================== DATABASES ==============================
databases:
  task-db:
    glyph: "▲"
    description: "Authoritative task store. Every issue, its status, and its dependency edges live here."

# ================================ SKILLS ===============================
# Two kinds of skill, and the difference matters to the test tiers:
#   standards-* / read-bead / create-bead = how the house works
#   framework-*                 = how ONE TOOL works (syntax, config, run commands)
# A test-tier AGENT owns the tier — what to cover and how deep. A framework SKILL owns the tool.
# That split is why no test agent has a framework opinion of its own.
# Note: the `standards` keys below are written short; the directories are standards-coding,
# standards-errors, standards-file-organization, standards-naming. framework-* keys are literal.
skills:
  read-bead:
    description: "The READ side of beads: declares that you are working inside a beads system and says what it is, then gives every command for reading — a ticket's details (`bd show --json --long`), its parent (`.parent`, `bd dep list`), its direct children (`bd show --children`), and the two reads that decide a tier's coverage: an epic reads ALL its features (gates are hidden from default queries, so an empty list is not an empty epic) and a feature reads ALL its tasks. Agents carry NO beads knowledge of their own: the agent text says only \"read the ticket you were given, and its children where children apply\", and this skill supplies the how. Reads are read-only; the claim belongs to the loop, the commands that hold a ticket open and close it arrive with the ticket itself, and authoring tickets is create-bead."
  errors:
    description: "Error factories, error taxonomies, and failure-mode handling standards."
  coding:
    description: "Core coding standards and idioms (style, structure, quality bar)."
  files:
    description: "File-organization and module-boundary conventions."
  naming:
    description: "Naming conventions across the codebase."
  framework-jest:
    description: "The Jest/Vitest tool: runner reality check, spec naming and placement, describe/it/expect, it.each tables, jest.fn/vi.mock, rejects.toThrow, call order, fake timers, factories, run commands. Loaded by the micro tier; it never decides what deserves a test."
  framework-playwright:
    description: "The Playwright tool: runner reality check, `.playwright.spec.ts` naming and placement, id-first locators and the getByRole fallback, web-first assertions and the anti-flake rules, page.route mocking at the boundary, test.extend/storageState, the page-object rule, playwright.config.ts, run/debug and trace triage. Loaded by BOTH browser tiers; it never decides what deserves a test."

# ================================ AGENTS ===============================
# `spawn` = the modes this agent is normally run in: s = subagent, b = background,
# w = windowed session. The dispatcher always uses b.
agents:
  engineer:
    description: "Business logic: domain functions, validators, transformers, API/service layer, hooks, types, error factories. Never tests, JSX or CSS."
    spawn: [s, b, w]
    certify: true
    skills: [files, naming]
  frontend:
    description: "UI: components, layouts, styling, shared component system, design tokens. Never logic, endpoints or tests."
    spawn: [s, b, w]
    certify: true
    skills: [coding, files, naming]
  # The three test tiers are ONE agent each, and each owns exactly one depth of coverage.
  # Tier = what to cover and how deep; the framework skill = the tool. No agent has a framework
  # opinion of its own. A tier never oversteps the next: three tiers, one test per behavior.
  unit-tester:
    tier: micro
    description: "Micro tier: ONE function at a time, in isolation, and exhaustive within it — every branch, boundary, empty/null, error. The only tier allowed to enumerate an input matrix. Never wiring, renders, browser or journeys."
    spawn: [s, b, w]
    certify: true
    skills: [read-bead, coding, files, naming, errors, framework-jest]
  feature-tester:
    tier: feature
    description: "Feature tier: proves one feature's unit-tested pieces are actually WIRED together and every error and success the feature encapsulates surfaces. Deliberately not exhaustive — one representative case per path, asserted at the seam; never re-runs the unit tier's matrix, never leaves the feature."
    spawn: [s, b, w]
    certify: true
    skills: [read-bead, coding, files, naming, errors, framework-playwright]
  e2e-tester:
    tier: epic
    description: "Epic tier: journeys ACROSS features in a real browser on the real stack — cross-feature state handoffs, session/persistence continuity, one success and one failure per feature seen from outside. The thinnest tier; mocks third parties only; duplicates nothing below it."
    spawn: [s, b, w]
    certify: true
    skills: [read-bead, coding, files, naming, errors, framework-playwright]
  lead-review:
    description: "Comprehensive review — traces the change, instruments, runs the tests, certifies."
    spawn: [s, b, w]
    certify: true
    skills: [errors, coding, files, naming]
  merge:
    description: "Collects the finished work and merges the PR once the frontier is clear."
    spawn: [s, b, w]
    certify: true
    skills: [files, naming]

# The three plan agents build the tower top-down and do no work in it, so they have
# no task node here — they are described at the bottom of this file.

# ================================ TASKS ================================
# Node keys ARE the stamps — one label, written at create time by plan-task, and
# verified with a `bd show --json` round trip. A ticket with zero or two stamps is
# never dispatched: the loop does not guess specialists.
#
# `gate` nodes are checkpoints, not work: the loop never sees one, and everything
# behind an open gate stays off the ready frontier. The human reads the merged PR
# and closes the gate. There is no human agent.
tasks:

  # ---------- Epic: the "what", one per product intent ----------
  epic:
    type: gate
    parent: null
    depends-on: [epic-merge-pr]      # the human closes it once the epic PR is merged
    respawn-agent: false
    description: "The highest-level understanding of what we are building. Created by plan-epic."

  # ---------- Epic tasks: run once the features are in ----------
  epic-e2e-test:
    type: task
    category: epic-e2e-test                # broad tier: journeys ACROSS features
    parent: epic
    depends-on: [feature]
    agents: [e2e-tester]
    respawn-agent: true
    description: "End-to-end journeys across the whole epic in a real browser on the real stack — cross-feature state handoffs, continuity, one success and one failure per feature seen from outside. Thinnest tier; third parties mocked only."
  epic-lead-review:
    type: task
    category: review
    parent: epic
    depends-on: [epic-e2e-test]
    agents: [lead-review]
    respawn-agent: false
    description: "Review the epic as a whole — trace the change, run the tests, certify."
  epic-merge-pr:
    type: task
    category: merge
    parent: epic
    depends-on: [epic-lead-review]
    agents: [merge]
    respawn-agent: false
    description: "Merge the epic PR once its review and e2e tests are green. Never dispatched by the loop."

  # ---------- Feature: a piece of the epic, one complete user-facing flow ----------
  feature:
    type: gate
    parent: epic
    depends-on: [feature-merge-pr]   # the human closes it once the feature PR is merged
    respawn-agent: false
    description: "A piece of the epic, described in terms of what the user gets, never how to build it. Created by plan-feature."

  # ---------- Feature tasks: run once the base tasks are in ----------
  feature-test:
    type: task
    category: feature-test                 # middle tier: one feature's pieces wired together
    parent: feature
    depends-on: [backend-logic, frontend-ui]
    agents: [feature-tester]
    respawn-agent: true
    description: "Proves this feature's unit-tested pieces are actually wired together against the finished UI and logic, and that every error and success it encapsulates surfaces. One case per path, asserted at the seam — not a re-run of the unit tier's matrix."
  feature-lead-review:
    type: task
    category: review
    parent: feature
    depends-on: [feature-test, unit-tests]
    agents: [lead-review]
    respawn-agent: false
    description: "Review the feature — trace the call chain, instrument, run the tests, certify."
  feature-merge-pr:
    type: task
    category: merge
    parent: feature
    depends-on: [feature-lead-review]
    agents: [merge]
    respawn-agent: false
    description: "Merge the feature PR once its review and tests are green. Never dispatched by the loop."

  # ---------- Base tasks: created from every feature; the ready frontier ----------
  backend-logic:
    type: task
    category: backend-logic
    parent: feature
    depends-on: []                   # no dependencies — claimed first
    agents: [engineer]
    respawn-agent: true
    description: "The feature's logic and back-end work."
  frontend-ui:
    type: task
    category: frontend-ux
    parent: feature
    depends-on: []                   # no dependencies — claimed first
    agents: [frontend]
    respawn-agent: true
    description: "The feature's UI work."
  unit-tests:
    type: task
    category: unit-tests                   # micro tier: one function, alone, exhaustively
    parent: feature
    depends-on: [backend-logic, frontend-ui]
    agents: [unit-tester]
    respawn-agent: true
    description: "Micro-tier tests for the feature's functions — one at a time, in isolation, exhaustive within each: every branch, boundary, empty/null input and error. The input matrix is enumerated HERE, so no tier above repeats it."

# ============================ PLAN AGENTS ==============================
# Build the tower top-down; the claim loop runs it bottom-up.
#   plan-epic    vague idea -> one epic            (`bd create -t gate`)
#   plan-feature epic -> features, parent-child    (phases: foundations -> core -> dependent -> polish)
#   plan-task    feature -> the tasks above, each stamped at create time

# ============================ EXECUTION ORDER ==========================
# The order the ready frontier releases them:
#   1. backend-logic, frontend-ui        (the frontier, no deps)
#   2. unit-tests, feature-test
#   3. feature-lead-review -> feature-merge-pr -> human closes the feature gate
#   4. epic-e2e-test -> epic-lead-review -> epic-merge-pr -> human closes the epic gate
