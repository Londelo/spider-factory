# Binary Obelisk — Design Model (editable source of truth)
#
# THREE NAMES, NEVER INTERCHANGEABLE — collapsing any two is how a tower silently
# dispatches nothing:
#   category = display hint, shown in `bd list`, names a plan-task template
#   label    = the ONE label a ticket carries (`bd create -l <label>`); what the
#              dispatcher matches on. Keys of `tasks:` below, bar none.
#   agent    = a real file in agents/; what gets spawned
#
# The three TEST nodes collapse label and category to ONE string on purpose: the node key
# IS the label IS the category. The agent is a separate name — "tester-" plus the scope it owns
#   unit-tests  -> tester-unit      feature-test -> tester-feature      epic-e2e-test -> tester-e2e
# Nothing derives an agent name from a label: the AGENT map in CLI/beads-loop.sh alone binds them.
# A tier is named for the TEST, never the tester, and never for a framework — the
# framework lives only in the framework-* skill the agent loads. Where label, category
# and agent drift apart, the wrong depth of coverage is dispatched and nothing reports it.
#
# Every node is a real beads issue. Relationships live in the arrays:
#   task.label     -> written with `bd create -l <label>`
#   task.parent    -> `--parent <id>` (or `--deps parent-child:<id>`) — hierarchy and reading
#                     ONLY; a parent-child edge never blocks
#   task.depends-on-> `bd dep add <task> <dep> --type blocks` — the ONLY thing that blocks: every
#                     parent is blocked-by each of its children (bottom-up), and the next tier is
#                     blocked-by the gate two levels down, not by the chain beside it
#   task.agents    -> who does the work
#
# TWO BRANCHES PER TOWER, not one per ticket. An epic has `epic/<slug>` and each feature has
# `feature/<slug>`; the tasks under a feature are COMMITS on that feature's branch, never branches
# of their own. TWO KEYS live in the ticket's `metadata`, read as `metadata` on the claim payload:
#   --metadata '{"branch":"feature/checkout-flow"}'
# `branch` is where this ticket's work lands — the plan's key, copied VERBATIM down from its own gate:
# the epic's rows carry the epic's, a feature's rows carry the feature's. `pr` is the pull request's URL:
# never written by a plan agent — the loop writes it onto the epic gate when it publishes that gate's
# branch, and the Stop hook writes it onto each ticket whose work landed. A PULL REQUEST'S BASE IS NOT A
# KEY: it is the epic gate's own `branch`, and the PARENT CHAIN names that gate (ticket -> feature ->
# epic), so the loop walks up and reads it there — `main` when the ticket hangs under the epic itself.
# Copying the epic's branch onto every row beneath it puts one fact in many places, where a corrected gate
# and its copies silently disagree; the tower already says which epic a ticket belongs to. Metadata is
# structured, so the loop reads the keys exactly; `notes` is prose and parses like prose, and
# `--external-ref` survives `bd show` but is absent from `bd ready --claim --json`. Nothing ever recomputes
# a branch name, and `--set-metadata` merges, so a later key never erases an earlier one.
#
# ONE CHAIN PER FEATURE. Each task waits on exactly one predecessor, so `bd ready` can hand out
# only one task of a feature at a time — one branch, one pair of hands. Features are independent
# and run side by side; an edge between two features exists only when one genuinely needs the other.
#
# Nothing here is read at runtime — the loop's only input is the beads database.
# The tower is built top-down by the plan agents (plan-epic -> plan-feature ->
# plan-task) and EXECUTED bottom-up (`bd ready --claim` hands out whatever is unblocked;
# closing a ticket's children is what lets its gate close). The dispatcher is
# CLI/beads-loop.sh; its contract lives in .claude/CLAUDE.md (the old claim-beads-loop.md
# was deleted in fc49051).
#
# respawn-agent: true = a fresh session of the same agent re-checks the work before
# the ticket may close. It is a STEP inside the one ticket, never a second ticket.

# ============================== DATABASES ==============================
databases:
  task-db:
    glyph: "▲"
    description: "Authoritative task store. Every issue, its status, and its dependency edges live here."

# ================================ SKILLS ===============================
# Two kinds of skill, and the difference matters to the test tiers:
#   standards-* / bead-* = how the house works
#   framework-*                 = how ONE TOOL works (syntax, config, run commands)
# A test-tier AGENT owns the tier — what to cover and how deep. A framework SKILL owns the tool.
# That split is why no test agent has a framework opinion of its own.
# Note: the `standards` keys below are written short; the directories are standards-coding,
# standards-errors, standards-file-organization, standards-naming. framework-* keys are literal.
skills:
  bead-read:
    description: "The READ side of the ticket system: declares that you are working inside one and says what it is, then gives every command for reading — a ticket's details (`bd show --json --long`), its parent (`.parent`, `bd dep list`), its direct children (`bd show --children`), and the two reads that decide a tier's coverage: an epic reads ALL its features (gates are hidden from default queries, so an empty list is not an empty epic) and a feature reads ALL its tasks. Agents carry NO ticket-system knowledge of their own: the agent text says only \"read the ticket you were given, and its children where children apply\", and this skill supplies the how. Reads are read-only; the claim belongs to the loop, no worker ever closes its own ticket (closing is a human act, done after reading the worker's report), and authoring tickets is bead-create."
  bead-create:
    description: "The CREATE side of the ticket system: authoring a ticket so it dispatches — the description as the worker's complete brief, the dispatching label written at create time (`bd create -l <label>`), the parent, the dependency edges, and the metadata keys. Belongs to the plan agents; a worker files no tickets."
  bead-initialize:
    description: "Standing the ticket system up in a repo: create the database, register the `gate` type the tower needs, set the config the dispatcher relies on. A utility outside the tower."
  bead-heartbeat:
    description: "The worker contract, loaded by every spawned worker first: keep the five-minute claim lease alive with `bd heartbeat <ticket>` between long steps (a lapsed lease reads as death to the supervisor-run reaper), never close your own ticket, put a comment on the ticket saying what remains when the brief outruns you, spawn nothing, stay on your branch in the folder you were given (the Stop hook files your one commit), and `touch $BO_DONE_FILE` as your very last action only when the brief is truly done."
  setup-cli:
    description: "Installing the `bo` dispatcher onto PATH with the real launcher, so it survives a plugin update. A utility outside the tower."
  diagram-authoring:
    description: "How to edit the LikeC4 diagrams so every node, arrow, step note and walkthrough says what the code actually does: the code is the only source of truth, the four things checked (title, summary, description, arrow plus step notes) against it and against each other, the grammar that breaks the parser, and the validate/build/screenshot proof with counts. A utility outside the tower."
  errors:
    description: "Error factories, error taxonomies, and failure-mode handling standards."
  coding:
    description: "Core coding standards and idioms (style, structure, quality bar)."
  files:
    description: "File-organization and module-boundary conventions."
  naming:
    description: "Naming conventions across the codebase."
  framework-jest:
    description: "The Jest/Vitest tool: runner reality check, spec naming and placement, describe/it/expect, it.each tables, jest.fn/vi.mock, rejects.toThrow, call order, fake timers, factories, run commands. Loaded by the micro tier; it never decides what deserves a test."
  framework-playwright:
    description: "The Playwright tool: runner reality check, `.playwright.spec.ts` naming and placement, id-first locators and the getByRole fallback, web-first assertions and the anti-flake rules, page.route mocking at the boundary, test.extend/storageState, the page-object rule, playwright.config.ts, run/debug and trace triage. Loaded by BOTH browser tiers; it never decides what deserves a test."

# ================================ AGENTS ===============================
# `spawn` = the modes this agent is normally run in: s = subagent, b = background,
# w = windowed session. The dispatcher always uses b.
agents:
  engineer:
    description: "Business logic: domain functions, validators, transformers, API/service layer, hooks, types, error factories. Never tests, JSX or CSS."
    spawn: [s, b, w]
    certify: true
    skills: [bead-heartbeat, bead-read, coding, files, naming, errors]
  frontend:
    description: "UI: components, layouts, styling, shared component system, design tokens. Never logic, endpoints or tests."
    spawn: [s, b, w]
    certify: true
    skills: [bead-heartbeat, coding, files, naming, errors]
  # The three test tiers are ONE agent each, and each owns exactly one depth of coverage.
  # Tier = what to cover and how deep; the framework skill = the tool. No agent has a framework
  # opinion of its own. A tier never oversteps the next: three tiers, one test per behavior.
  tester-unit:
    tier: micro
    description: "Micro tier: ONE back-end function at a time, in isolation, and exhaustive within it — every branch, boundary, empty/null, error. The only tier allowed to enumerate an input matrix. Back-end only: it never touches components. Never wiring, renders, browser or journeys."
    spawn: [s, b, w]
    certify: true
    skills: [bead-heartbeat, bead-read, coding, files, naming, errors, framework-jest]
  tester-feature:
    tier: feature
    description: "Feature tier: proves one feature's unit-tested pieces are actually WIRED together and every error and success the feature encapsulates surfaces. Deliberately not exhaustive — one representative case per path, asserted at the seam; never re-runs the unit tier's matrix, never leaves the feature."
    spawn: [s, b, w]
    certify: true
    skills: [bead-heartbeat, bead-read, coding, files, naming, errors, framework-playwright]
  tester-e2e:
    tier: epic
    description: "Epic tier: journeys ACROSS features in a real browser on the real stack — cross-feature state handoffs, session/persistence continuity, one success and one failure per feature seen from outside. The thinnest tier; mocks third parties only; duplicates nothing below it."
    spawn: [s, b, w]
    certify: true
    skills: [bead-heartbeat, bead-read, coding, files, naming, errors, framework-playwright]
  review:
    description: "Reads its ticket and the tickets around it, reads the diff it is handed, maps the whole system the change touches, instruments that system with trace logs, runs the tests against the instrumented code, then answers three questions from first principles — does the code do what its source of truth demands, do the tests prove it, is it simple and readable. Posts findings as PR comments; files no tickets and commits or pushes nothing — the trace logs stay in the working tree."
    spawn: [s, b, w]
    certify: true
    skills: [bead-heartbeat]    # bead-read, the four standards and pr-comments load on demand at the step that uses them — never preloaded
  merge:
    description: "Epic tier only. Assembles the epic's finished feature branches onto its epic branch, in its own worktree: finds the pieces, resolves the conflicts between them, then runs the project's own test command and reports. Writes no code and no tests — tests are evidence, not a suspect. Does not merge into main and opens no pull request. Dispatched by the loop like any other label."
    spawn: [s, b, w]
    certify: true
    skills: [bead-heartbeat, bead-read]

# The three plan agents build the tower top-down and do no work in it, so they have
# no task node here — they are described at the bottom of this file.

# ================================ TASKS ================================
# Node keys ARE the dispatching labels — one per ticket, written at create time by plan-task, and
# verified with a `bd show --json` round trip. A ticket with zero or two dispatching labels is
# never dispatched: the loop does not guess specialists.
#
# `gate` nodes are checkpoints, not work, and they are invisible to `bd ready` — the loop
# never sees one, so there is nothing to filter. What a gate DOES is hold the NEXT tier
# back: the tickets behind it are blocked-by the gate itself, and only a human closes a
# gate, so the tower stalls at the gate until a human verifies and closes it.
# The human reads the merged PR and closes the gate. There is no human agent.
tasks:

  # ---------- Epic: the "what", one per product intent ----------
  epic:
    type: gate
    parent: null
    branch: "epic/<slug>"           # the epic's ONE metadata key, and the base every feature PR beneath it aims at. Carried verbatim by the epic's own tickets.
    depends-on: [epic-merge-pr, epic-e2e-test, epic-review]  # blocked-by every child (bottom-up); the human closes it once they are all closed
    respawn-agent: false
    description: "The highest-level understanding of what we are building. Created by plan-epic."

  # ---------- Epic tasks: run once the features are in ----------
  epic-review:
    type: task
    category: review
    parent: epic
    depends-on: [feature, epic-e2e-test]   # the tier stalls at the feature gate until a human closes it
    agents: [review]
    respawn-agent: false
    description: "Review the epic as a whole — map the flow across the features, instrument it, run the suites against the instrumented code, then answer the three questions."
  epic-e2e-test:
    type: task
    category: epic-e2e-test                # broad tier: journeys ACROSS features
    parent: epic
    depends-on: [feature, epic-merge-pr]   # the tier stalls at the feature gate; merge goes in first
    agents: [tester-e2e]
    respawn-agent: true
    description: "End-to-end journeys across the whole epic in a real browser on the real stack — cross-feature state handoffs, continuity, one success and one failure per feature seen from outside. Thinnest tier; third parties mocked only."
  epic-merge-pr:
    type: task
    category: merge
    parent: epic
    depends-on: [feature]
    agents: [merge]
    respawn-agent: false
    description: "Assemble the epic's finished feature branches onto its epic branch. This runs BEFORE the e2e suite and before the review, so both are proved against the assembled result. Dispatched by the loop like any other label."

  # ---------- Feature: a piece of the epic, one complete user-facing flow ----------
  feature:
    type: gate
    parent: epic
    branch: "feature/<slug>"        # metadata `branch`, carried verbatim by every task under it. Its PR's base is the epic's `branch`, read off the epic gate — never copied down. The `pr` url is not the plan's — the Stop hook writes it.
    depends-on: [backend-logic, unit-tests, frontend-ui, feature-test, feature-review]  # blocked-by every child (bottom-up); the human closes it once they are all closed
    respawn-agent: false
    description: "A piece of the epic, described in terms of what the user gets, never how to build it. Created by plan-feature. The gate's PR IS the feature branch: closing the gate is merging it onto the epic branch."

  # ---------- Feature tasks: run once the base tasks are in ----------
  feature-review:
    type: task
    category: review
    parent: feature
    depends-on: [feature-test]
    agents: [review]
    respawn-agent: false
    description: "Review the feature — map the flow it sits in, instrument it, run the suites against the instrumented code, then answer the three questions."
  feature-test:
    type: task
    category: feature-test                 # middle tier: one feature's pieces wired together
    parent: feature
    depends-on: [frontend-ui]              # the tail of the task chain, not a merge — it is proved on the feature branch
    agents: [tester-feature]
    respawn-agent: true
    description: "Proves this feature's unit-tested pieces are actually wired together against the finished UI and logic, and that every error and success it encapsulates surfaces. One case per path, asserted at the seam — not a re-run of the unit tier's matrix."

  # ---------- The feature's task chain ----------
  # These three labels are the worker stamps plan-task creates, ONE CHAIN: each ticket waits on the
  # one ticket before it, the first waits on nothing. One chain is what keeps one branch owned by one
  # pair of hands — `bd ready` can only ever hand out the single unblocked ticket of a feature, so two
  # workers never commit to the same feature branch at once. Features stay independent of each other
  # and run side by side; that parallelism is the absence of an edge, never the presence of one.
  backend-logic:
    type: task
    category: backend-logic
    parent: feature
    depends-on: []                   # the head of the chain — claimed first
    agents: [engineer]
    respawn-agent: true
    description: "The feature's logic and back-end work."
  unit-tests:
    type: task
    category: unit-tests                   # micro tier: one back-end function, alone, exhaustively
    parent: feature
    depends-on: [backend-logic]             # the chain: its one predecessor is the unit it tests
    agents: [tester-unit]
    respawn-agent: true
    description: "Micro-tier tests for the feature's BACK-END functions — one at a time, in isolation, exhaustive within each: every branch, boundary, empty/null input and error. The input matrix is enumerated HERE, so no tier above repeats it. Back-end only: the UI has no micro tier, the components are proved by the feature tier."
  frontend-ui:
    type: task
    category: frontend-ux
    parent: feature
    depends-on: [unit-tests]         # the chain: waits on the one ticket before it; the tail before the suite
    agents: [frontend]
    respawn-agent: true
    description: "The feature's UI work — built after the logic is written and proved, so the page is built against functions that already hold."

# ============================ PLAN AGENTS ==============================
# Build the tower top-down; the claim loop runs it bottom-up.
#   plan-epic    vague idea -> one epic + `epic/<slug>`            (`bd create -t gate`; its ONE key)
#   plan-feature epic -> features, parent-child + `feature/<slug>` (phases: foundations -> core ->
#                        dependent -> polish; two structural tickets per feature, not three)
#   plan-task    feature -> the tasks above, each labeled at create time, all chained, all carrying
#                        the feature's `branch` copied verbatim from the gate
# Each plan agent writes one key, its own gate's `branch`, down to its own rows. No plan agent ever writes
# `pr`: that url belongs to the loop (the epic gate's) and the Stop hook (every ticket whose work landed).
# No plan agent writes a PR base either: a ticket aims at its epic's branch because it hangs under that
# epic, and the loop reads that branch off the gate.
#
# A slug is the name of the thing, lowercased, hyphenated, two or three words: `checkout-flow`,
# `notes-sync`. No ids, no dates, no ticket numbers, no randomness — a person reads the branch name in
# `git branch` and knows which feature it is. The plan agent that names a gate owns that branch name and
# writes it onto the gate's metadata once; the rows of that gate's own tier copy it, and nobody recomputes it.

# ============================ EXECUTION ORDER ==========================
# The order the ready frontier releases them. The depends-on graph above is the ONLY thing
# that enforces this order, so trust that graph over this comment if they ever drift.
#
# ONE CHAIN, ONE BRANCH. Every task under a feature waits on the single ticket before it, so the
# frontier releases them in this order and never two of them at once — each one is a commit onto the
# feature's branch, and only one pair of hands ever holds that branch. Nothing is assembled and nothing
# is merged at the feature tier: the branch IS the work. Features run side by side because nothing
# joins them; the epic is where the joining happens. No agent closes a gate and nothing closes itself.
#
#   feature:  backend-logic -> unit-tests -> frontend-ui                 (one chain, one branch)
#             -> feature-test                                            (proved on the feature branch)
#             -> feature-review                                          (the three questions, same branch)
#             -> feature gate                                            (a human closes it: the PR to
#                                                                          the epic branch merges then)
#
#   epic:     epic-merge-pr -> epic-e2e-test -> epic-review -> epic gate (a human closes it)
#
# The epic tier still assembles, because it has many branches to assemble: the merge puts every
# finished feature branch onto the epic branch, and both the e2e suite and the review are proved
# against that assembled result.
